[package]
name = "cpr-diaoyong"
version = "0.1.3"
edition = "2024"
rust-version = "1.99.1"
publish = false

[dependencies]
chrono = { version = "0.4.44", default-features = false, features = ["clock", "serde"] }
form_urlencoded = "1.2.2"
futures-util = { version = "0.3.32", default-features = false, features = ["std"] }
gateway-plugin-sdk = { git = "https://github.com/zyycn/codex-proxy-rs.git", rev = "6900da36eedb3099d43c8c9bf5b8b97d82d15688", features = ["io"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
tokio = { version = "1.52.3", features = ["io-std", "macros", "rt", "sync"] }
uuid = { version = "1.23.0", features = ["serde", "v4"] }

[lints.rust]
unsafe_code = "forbid"

[profile.release]
strip = "symbols"
